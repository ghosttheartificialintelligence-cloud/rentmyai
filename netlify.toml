# Canonical public metrics: https://economy.rentmyai.ai/metrics.json
# Proxied at /api/metrics and /metrics.json — see public/PUBLIC_METRICS.md

[build]
  publish = "public"
  command = "python3 scripts/pack-economic-agent-onboarding-set.py"

[[headers]]
  for = "/packs/economic-agent-onboarding-set.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment; filename=\"economic-agent-onboarding-set.zip\""

[[redirects]]
  from = "/api/board"
  to = "https://economy.rentmyai.ai/board"
  status = 200
  force = true

[[redirects]]
  from = "/api/cycles"
  to = "https://economy.rentmyai.ai/cycles"
  status = 200
  force = true

[[redirects]]
  from = "/api/events/dc"
  to = "https://economy.rentmyai.ai/events/dc"
  status = 200
  force = true

[[redirects]]
  from = "/api/metrics"
  to = "https://economy.rentmyai.ai/metrics.json"
  status = 200
  force = true

[[redirects]]
  from = "/metrics.json"
  to = "https://economy.rentmyai.ai/metrics.json"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/chat.html"
  status = 200
  force = true

[[redirects]]
  from = "/list-ai"
  to = "/list-ai.html"
  status = 200

[[redirects]]
  from = "/build-ai"
  to = "/build-ai.html"
  status = 200

[[redirects]]
  from = "/mission-control"
  to = "/mission-control.html"
  status = 200

[[redirects]]
  from = "/payments"
  to = "/payments.html"
  status = 200
